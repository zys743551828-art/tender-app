# 历史旧 backend 供体恢复入口，非当前 workbench 推荐或交付步骤；保留 service 行为供追溯。
# 当前 Word 路线见 ../../workbench/deploy/word_prebuilt.py 与 tender-docs《工作台实现架构》ADR／《团队运行故障排查》。
# Gotenberg HTTP 薄适配不是本文件目录队列协议的直接替代；本次不构建、不删除镜像或数据。
name: bidwb-word
services:
  converter:
    image: bidwb-word:7.4.7
    build: .
    init: true
    user: "65534:65534"
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1
    pids_limit: 128
    stop_grace_period: 70s
    tmpfs:
      - /tmp:ro,noexec,nosuid,nodev,size=1m,mode=0555
      - /work:rw,noexec,nosuid,nodev,size=256m,uid=65534,gid=65534,mode=0700
    volumes:
      - word-input:/word-input:ro
      - word-output:/word-output:rw
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"
volumes:
  word-input: {}
  word-output: {}
