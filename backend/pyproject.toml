[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "bidwb"
version = "0.1.0"
description = "施组工作台后端（API、任务协议、worker）"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "sqlalchemy>=2.0.30",
  "psycopg[binary,pool]>=3.2",
  "alembic>=1.13",
  "argon2-cffi>=23.1",
  "structlog>=24.1",
  "boto3>=1.34",
  "confluent-kafka>=2.5",
  "pypdfium2>=4.30",
  "python-docx>=1.1",
  "httpx>=0.27",
  "python-multipart>=0.0.9",
]

[project.optional-dependencies]
parsing = [
  "rapidocr==3.10.0",
  "onnxruntime==1.31.0",
  "pdfplumber==0.11.9",
]
dev = [
  "pytest>=8.2",
  "moto[s3]>=5.0",
  "reportlab>=4.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "boto3-stubs[s3]>=1.34",
]

[project.scripts]
bidwb-api = "bidwb.entrypoints:run_api"
bidwb-relay = "bidwb.entrypoints:run_relay"
bidwb-reaper = "bidwb.entrypoints:run_reaper"
bidwb-worker = "bidwb.entrypoints:run_worker"
bidwb-admin = "bidwb.admin:main"

[tool.hatch.build.targets.wheel]
packages = ["src/bidwb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: 需要真实 PostgreSQL（BIDWB_TEST_ADMIN_DSN）"]
filterwarnings = ["error::DeprecationWarning:bidwb.*"]

[tool.ruff]
line-length = 140
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["tools"]  # 开发辅助脚本，不套用产品代码的规则

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "PL", "RUF", "S", "T20", "PT"]
ignore = [
  "PLR0913",  # 领域函数参数较多是常态
  "PLR0917",  # FastAPI 依赖注入使路由函数参数较多
  "PLR2004",  # 业务常量比较
  "S101",     # 测试使用 assert
  "RUF001", "RUF002", "RUF003",  # 中文全角标点
  "E501",     # 行宽由 ruff format 管理；剩余超长行多为 SQL 字符串与中文注释，硬拆反而难读
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311", "PLR0915", "PT018", "PT012", "SLF001", "ARG001", "ARG002", "PLC0415"]
"src/bidwb/admin.py" = ["T201"]  # 命令行工具，输出到标准输出是它的职责

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["confluent_kafka.*", "pypdfium2.*", "argon2.*", "rapidocr.*", "pdfplumber.*"]
ignore_missing_imports = true
