name: Workbench CI

on:
  push:
    branches: [main, fusion/bid-workbench]
    paths: ["workbench/**", ".github/workflows/workbench-ci.yml"]
  pull_request:
    branches: [main, fusion/bid-workbench]
    paths: ["workbench/**", ".github/workflows/workbench-ci.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workbench-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  WORKBENCH_ENV_FILE: explicit-ci-no-business-profile

jobs:
  backend:
    name: Backend quality and default tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workbench/requirements.lock.txt
            workbench/requirements-fusion-checks.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-fusion-checks.txt
      - name: Verify dependency consistency
        run: python -m pip check
      - name: Install real OCR and Chinese font dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y tesseract-ocr fonts-noto-cjk
      - name: Fetch and verify pinned public OCR dictionaries
        run: python -m packages.parsing.fetch_assets --directory .local/parsing-models
      - name: Ruff
        run: python -m ruff check apps/api apps/worker packages deploy tests
      - name: Formatting
        run: python -m ruff format --check apps/api apps/worker packages deploy tests
      - name: Types
        run: python -m mypy apps/api apps/worker packages deploy
      - name: Security checks
        run: python -m bandit -q -ll -r apps/api,apps/worker,packages,deploy -x packages/parsing/qa
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workbench/apps/web/package-lock.json
      - name: Install web build dependencies for deployment tests
        working-directory: workbench/apps/web
        run: npm ci --no-audit --no-fund
      - name: Build the exact web inputs required by deployment tests
        working-directory: workbench/apps/web
        run: npm run build
      - name: Default tests (external coverage reported as skipped)
        run: python deploy/ci_checks.py --suite unit
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-default-${{ github.sha }}
          path: workbench/.local/ci/unit/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  postgres:
    name: PostgreSQL 17 non-owner API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          # Public synthetic CI credential, scoped to this disposable service.
          POSTGRES_PASSWORD: tender-ci-disposable
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workbench/requirements.lock.txt
            workbench/requirements-fusion-checks.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-fusion-checks.txt
      - name: Run actual database and API suites (no skipped tests allowed)
        env:
          CI_POSTGRES_DSN: postgresql://postgres:tender-ci-disposable@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: python deploy/ci_checks.py --suite postgres --disposable-postgres
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-postgres-${{ github.sha }}
          path: workbench/.local/ci/postgres/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  scoring:
    name: Material request preflight and execution ledger on PostgreSQL 17
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: tender-ci-disposable
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workbench/requirements.lock.txt
            workbench/requirements-fusion-checks.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-fusion-checks.txt
      - name: Run serial native preflight and fee-ledger suites
        env:
          CI_POSTGRES_DSN: postgresql://postgres:tender-ci-disposable@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: python deploy/ci_checks.py --suite scoring --disposable-postgres
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-scoring-${{ github.sha }}
          path: workbench/.local/ci/scoring/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  dispatch:
    name: Material outbox dispatch on PostgreSQL 17 and Kafka 4.1.2
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: tender-ci-disposable
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workbench/requirements.lock.txt
            workbench/requirements-fusion-checks.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-fusion-checks.txt
      - name: Install Java 17 for the isolated broker
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y openjdk-17-jre-headless
      - name: Download and verify the official Kafka release
        run: |
          mkdir -p .local/ci/bin
          curl --fail --location --retry 3 --output .local/ci/bin/kafka.tgz https://archive.apache.org/dist/kafka/4.1.2/kafka_2.13-4.1.2.tgz
          sha512sum --check <<'SHA512'
          78ac6e488b1071122f9608dfdb363f6fe50e1dbbc492347002c0398dfbf77e0d8caa5bf794c5937379721004dfe92025937d238b0faf4eb715529417fd43b491  .local/ci/bin/kafka.tgz
          SHA512
          tar --no-same-owner -xzf .local/ci/bin/kafka.tgz -C .local/ci/bin
      - name: Run native outbox, fenced consumer and real Kafka delivery tests
        env:
          CI_POSTGRES_DSN: postgresql://postgres:tender-ci-disposable@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
          JAVA_HOME: /usr/lib/jvm/java-17-openjdk-amd64
        run: python deploy/ci_checks.py --suite dispatch --disposable-postgres --kafka-home .local/ci/bin/kafka_2.13-4.1.2
      - name: Preserve test evidence and broker lifecycle log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-dispatch-${{ github.sha }}
          path: workbench/.local/ci/dispatch/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  candidate:
    name: Fresh authoring schema and independent SCRAM role permissions
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: tender-ci-disposable
          POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workbench/requirements.lock.txt
            workbench/requirements-fusion-checks.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-fusion-checks.txt
      - name: Verify fresh bootstrap and effective permissions with real password logins
        env:
          CI_POSTGRES_DSN: postgresql://postgres:tender-ci-disposable@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: python deploy/ci_checks.py --suite candidate --disposable-postgres
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-candidate-${{ github.sha }}
          path: workbench/.local/ci/candidate/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  authoring:
    name: Fixed-source editing and Word export on PostgreSQL and S3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: pgvector/pgvector@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
        env:
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: tender-ci-disposable
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workbench/requirements.lock.txt
            workbench/requirements-fusion-checks.txt
      - name: Install locked dependencies
        run: python -m pip install -r requirements-fusion-checks.txt
      - name: Download and verify isolated S3 test service
        run: |
          mkdir -p .local/ci/bin
          curl --fail --location --retry 3 --output .local/ci/bin/seaweedfs.tar.gz https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz
          sha256sum --check <<'SHA256'
          4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124  .local/ci/bin/seaweedfs.tar.gz
          SHA256
          tar -xzf .local/ci/bin/seaweedfs.tar.gz -C .local/ci/bin weed
      - name: Run native fixed-source revisions, manual edits and actual Word export
        env:
          CI_POSTGRES_DSN: postgresql://postgres:tender-ci-disposable@127.0.0.1:${{ job.services.postgres.ports['5432'] }}/postgres
        run: python deploy/ci_checks.py --suite authoring --disposable-postgres --weed .local/ci/bin/weed
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-authoring-${{ github.sha }}
          path: workbench/.local/ci/authoring/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  recovery:
    name: Extended-schema backup and quarantine restore on PostgreSQL 17 and S3
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: workbench
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            workbench/requirements.lock.txt
            workbench/requirements-fusion-checks.txt
      - name: Install locked Python dependencies
        run: python -m pip install -r requirements-fusion-checks.txt
      - name: Download and verify fixed official PostgreSQL packages
        run: |
          mkdir -p .local/ci/bin/postgres
          curl --fail --location --retry 3 --output .local/ci/bin/postgres/postgresql-17.deb https://apt.postgresql.org/pub/repos/apt/pool/main/p/postgresql-17/postgresql-17_17.11-1.pgdg24.04+2_amd64.deb
          curl --fail --location --retry 3 --output .local/ci/bin/postgres/postgresql-client-17.deb https://apt.postgresql.org/pub/repos/apt/pool/main/p/postgresql-17/postgresql-client-17_17.11-1.pgdg24.04+2_amd64.deb
          curl --fail --location --retry 3 --output .local/ci/bin/postgres/pgvector.deb https://apt.postgresql.org/pub/repos/apt/pool/main/p/pgvector/postgresql-17-pgvector_0.8.7-1.pgdg24.04+1_amd64.deb
          curl --fail --location --retry 3 --output .local/ci/bin/postgres/libpq5.deb https://apt.postgresql.org/pub/repos/apt/pool/main/p/postgresql-18/libpq5_18.6-1.pgdg24.04+2_amd64.deb
          sha256sum --check <<'SHA256'
          d5b58058a82a3f344f832aea2cc54badc4f6265c25c960752cb1f5df5d2180ee  .local/ci/bin/postgres/postgresql-17.deb
          b3b071b67a814a382516d6f6241b529c52f909672457e2f48083acce047b634f  .local/ci/bin/postgres/postgresql-client-17.deb
          57aff7b502276098b1da660fd3d5139f030a740d193858cf5107cc624b0a903a  .local/ci/bin/postgres/pgvector.deb
          b487c5ed2ceb9244c6a9d6ae65818ed6707c3c44a2e14488394ae4194c52c53b  .local/ci/bin/postgres/libpq5.deb
          SHA256
      - name: Install database tools without creating a shared default cluster
        run: |
          sudo apt-get update
          sudo install -d /etc/postgresql-common
          printf '%s\n' 'create_main_cluster = false' | sudo tee /etc/postgresql-common/createcluster.conf >/dev/null
          sudo apt-get install --no-install-recommends -y ./.local/ci/bin/postgres/*.deb
          /usr/lib/postgresql/17/bin/postgres --version
          dpkg-query --show postgresql-17 postgresql-client-17 postgresql-17-pgvector libpq5
      - name: Download and verify isolated S3 test service
        run: |
          curl --fail --location --retry 3 --output .local/ci/bin/seaweedfs.tar.gz https://github.com/seaweedfs/seaweedfs/releases/download/4.48/linux_amd64.tar.gz
          sha256sum --check <<'SHA256'
          4a7d108384d044d95212d1342cdda9533fa55842c1c9b41f606ca3c8a9561124  .local/ci/bin/seaweedfs.tar.gz
          SHA256
          tar -xzf .local/ci/bin/seaweedfs.tar.gz -C .local/ci/bin weed
      - name: Restore nonempty authoring, material ledger and dispatch records into quarantine
        run: python -m deploy.extended_recovery_runtime --pg-bin /usr/lib/postgresql/17/bin --weed "$PWD/.local/ci/bin/weed" --report-dir .local/ci/recovery
      - name: Preserve nonsecret test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-recovery-${{ github.sha }}
          path: workbench/.local/ci/recovery/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  frontend:
    name: Frontend quality, tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: workbench/apps/web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: workbench/apps/web/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Formatting
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Types
        run: npm run typecheck
      - name: Complete component and protocol tests
        run: npm test -- --maxWorkers=1 --minWorkers=1 --reporter=default --reporter=junit --outputFile.junit=../../.local/ci/frontend/junit.xml
      - name: Production build
        run: npm run build
      - name: Install pinned isolated browser tools
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tender-playwright
        run: |
          npm install --prefix "$RUNNER_TEMP/tender-browser-tools" --ignore-scripts --no-audit --no-fund playwright@1.51.1
          "$RUNNER_TEMP/tender-browser-tools/node_modules/.bin/playwright" install --with-deps chromium
      - name: Actual Chromium desktop, mobile and theme checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tender-playwright
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tender-browser-tools/node_modules/playwright
        run: node scripts/check-project-review-summary-browser.mjs ../../.local/ci/frontend/browser
      - name: Actual Chromium fixed-source editing and lost-response recovery
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tender-playwright
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tender-browser-tools/node_modules/playwright
        run: node scripts/check-exact-text-edit-browser.mjs ../../.local/ci/frontend/exact-text-edit-browser
      - name: Actual Chromium submission preflight, keyboard and stale-response checks
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/tender-playwright
          PLAYWRIGHT_MODULE: ${{ runner.temp }}/tender-browser-tools/node_modules/playwright
        run: node scripts/check-submission-preflight-browser.mjs ../../.local/ci/frontend/submission-preflight-browser
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-${{ github.sha }}
          path: workbench/.local/ci/frontend/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14
