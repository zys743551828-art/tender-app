resolver 127.0.0.11 valid=5s ipv6=off;
upstream fusion_api {
    zone fusion_api 64k;
    server api:8000 resolve;
}

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 5m;
    # Cookie-bound private transfer tickets must not enter access/upstream error logs.
    access_log off;
    error_log /dev/null;

    location = /nginx-health {
        access_log off;
        proxy_pass http://fusion_api/health/ready;
        proxy_set_header Host $http_host;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
    }
    # Source bytes only. The application verifies the exact signed size, digest and 100 MiB limit.
    location ~ "^/api/v1/object-transfers/uploads/[0-9a-fA-F-]{36}$" {
        client_max_body_size 100m;
        proxy_request_buffering off;
        proxy_pass http://fusion_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
        proxy_send_timeout 310s;
        proxy_buffering off;
    }
    location ~ "^/api/v1/object-transfers/multipart/[0-9a-fA-F-]{36}/parts/(?:[1-9][0-9]{0,3}|10000)$" {
        client_max_body_size 8m;
        proxy_request_buffering off;
        proxy_pass http://fusion_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 310s;
        proxy_buffering off;
    }
    location = /api/v1/research/import-previews {
        client_max_body_size 9m;
        proxy_pass http://fusion_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location ~ "^/api/v1/bids/[0-9a-fA-F-]{36}/authoring-images$" {
        client_max_body_size 12m;
        proxy_pass http://fusion_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location /api/ {
        proxy_pass http://fusion_api;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
