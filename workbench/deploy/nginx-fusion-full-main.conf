# Complete main configuration: independent of image defaults and root-owned cache paths.
worker_processes 1;
pid /tmp/nginx-full.pid;
error_log /dev/null;

events { worker_connections 1024; }

http {
    # Only types required by the built web client and its ordinary assets.
    types {
        text/html html;
        text/css css;
        application/javascript js mjs;
        application/json json map;
        application/wasm wasm;
        application/pdf pdf;
        image/svg+xml svg;
        image/png png;
        image/jpeg jpg jpeg;
        image/webp webp;
        image/avif avif;
        image/x-icon ico;
        font/woff woff;
        font/woff2 woff2;
        font/ttf ttf;
        font/otf otf;
    }
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;
    access_log off;
    client_body_temp_path /tmp/nginx-client;
    proxy_temp_path /tmp/nginx-proxy;
    fastcgi_temp_path /tmp/nginx-fastcgi;
    uwsgi_temp_path /tmp/nginx-uwsgi;
    scgi_temp_path /tmp/nginx-scgi;
    proxy_http_version 1.1;
    include /etc/nginx/conf.d/fusion-full-server.conf;
}
